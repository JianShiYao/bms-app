# mps2/an386 专属配置（Windows 上的 PC 仿真目标，Cortex-M4F）
#
# 选用 mps2/an386 作为仿真目标：与 STM32F405 同为 Cortex-M4F（带硬件 FPU），
# 架构忠实，可提前暴露 FPU 相关配置问题，迁移到真机更平滑。
# native_sim 的 POSIX 架构只支持 Linux（见 zephyr/arch/posix/CMakeLists.txt），
# Windows 上不可用。该 board 无真实 ADC/CAN 硬件，afe/comm 模块走桩数据源。
#
# 运行：west build -b mps2/an386 app && west build -t run
CONFIG_LOG_MODE_IMMEDIATE=y

# 启用硬件 FPU（与 F405 一致，验证带 FPU 上下文的线程/中断栈配置）
CONFIG_FPU=y
