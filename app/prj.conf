# BMS 应用通用配置（与 board 无关的基础项）

# --- 日志 ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_CBPRINTF_FP_SUPPORT=y     # 日志中打印浮点（SOC/电压）

# --- zbus 消息总线 ---
CONFIG_ZBUS=y

# --- 线程 / 内核 ---
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

# --- BMS 模块开关（详见 app/Kconfig）---
CONFIG_BMS_AFE=y
CONFIG_BMS_SOC=y
CONFIG_BMS_PROTECTION=y
CONFIG_BMS_BALANCING=y
CONFIG_BMS_COMM=y
