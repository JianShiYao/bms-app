# BMS 应用通用配置（与 board 无关的基础项）
#
# 本文件是「应用级」Kconfig 默认值，对所有 board 生效；board 专属项放各 board 的
# defconfig/overlay。最终生效值（合并 board defconfig + 命令行 -D 后）见 build/zephyr/.config。
# 各 CONFIG_* 的完整说明可在 `west build -t menuconfig` 中搜索，或查 Zephyr 文档。

# --- 日志 ---
CONFIG_LOG=y                     # 启用日志子系统（各模块的 LOG_INF/LOG_ERR 等）
CONFIG_LOG_MODE_DEFERRED=y       # 延迟模式：日志在独立线程异步处理，不阻塞调用线程，
                                 #   且可安全在中断/高优先级（如 protection）上下文打印
CONFIG_CBPRINTF_FP_SUPPORT=y     # 让日志格式化支持 %f 浮点（SOC permille→%、电压等）

# --- zbus 消息总线 ---
CONFIG_ZBUS=y                    # 启用 zbus：模块间唯一通信机制，发布/订阅 channel 实现解耦

# --- 线程 / 内核 ---
# main 线程栈大小（字节）；main 负责按 Kconfig 调各 bms_*_init()
# 注：int 型 CONFIG 的值后不能跟行内注释（会被并入数值导致 Kconfig 报错），故注释独占一行。
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_THREAD_NAME=y             # 为线程保存可读名字，便于日志/调试时辨认（afe/soc/protection…）
CONFIG_THREAD_MONITOR=y          # 维护线程链表，支持 thread analyzer / 栈用量排查

# --- BMS 模块开关（详见 app/Kconfig；关掉某项则该模块不编译、不启动线程）---
CONFIG_BMS_AFE=y                 # afe：周期采样 cell 电压/电流/温度，发布 chan_cell_meas
CONFIG_BMS_SOC=y                 # soc：库仑计 SOC/SOH 估算，订阅 meas、发布 chan_soc
CONFIG_BMS_PROTECTION=y          # protection：OV/UV/OC/OT 状态机 + 接触器控制（安全关键，最高优先级）
CONFIG_BMS_BALANCING=y           # balancing：单体均衡，算出需放电的 bit-mask
CONFIG_BMS_COMM=y                # comm：快照各 channel 经 CAN 上报（仿真下打日志）
