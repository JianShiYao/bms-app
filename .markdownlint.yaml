# Project markdown style (read by the markdownlint VS Code extension & CLI).
# Disables layout-opinion rules that conflict with our compact Chinese
# technical-doc style; keeps rules that catch real mistakes.
default: true

MD013: false   # line-length — long prose lines and wide tables are intentional
MD022: false   # blanks-around-headings — compact heading -> content style
MD031: false   # blanks-around-fences
MD032: false   # blanks-around-lists
MD033: false   # inline-html — templates use <!-- ... --> comments
MD034: false   # bare-urls — plain URLs in docs/changelog are fine
MD040: false   # fenced-code-language — ASCII diagrams / flow blocks have no language
MD041: false   # first-line-heading — template files lead with an HTML comment
MD060: false   # table-column-style — compact tables (no padding) are intentional

MD024:
  siblings_only: true   # allow repeated "### Added" under different version headings (CHANGELOG)
