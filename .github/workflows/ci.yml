name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Gate 1: source formatting must match the Zephyr clang-format style.
  # clang-format is pinned to the same version used locally so CI and local
  # produce identical verdicts.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install clang-format (pinned to local version)
        run: pip install "clang-format==22.1.5"
      - name: Check formatting
        run: |
          files=$(find app drivers tests \( -name '*.c' -o -name '*.h' \) 2>/dev/null)
          if [ -z "$files" ]; then echo "no source files to check"; exit 0; fi
          clang-format --dry-run --Werror --style=file $files

  # Gate 2: build the target firmware and run the unit tests.
  # Only runs if formatting passed.
  build-test:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout (manifest repo) into workspace subdir
        uses: actions/checkout@v4
        with:
          path: bms-app
      - name: Set up Zephyr (west + SDK)
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Build firmware (mps2/an386)
        run: west build -b mps2/an386 bms-app/app
      - name: Run unit tests (native_sim)
        run: west twister -T bms-app/tests -p native_sim --inline-logs
