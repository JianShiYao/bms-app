name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Gate 1: formatting (fast fail-first). clang-format pinned to match local.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install clang-format (pinned to local version)
        run: pip install "clang-format==22.1.5"
      - name: Check formatting
        run: |
          files=$(find app drivers tests \( -name '*.c' -o -name '*.h' \) 2>/dev/null)
          if [ -z "$files" ]; then echo "no source files to check"; exit 0; fi
          clang-format --dry-run --Werror --style=file $files

  # Gate 2: build firmware for each compilable target.
  # NOTE: bms_f405 is an incomplete board template — add `enervenue/bms_f405`
  # to the matrix once its dts/defconfig TODOs are resolved.
  # qmxx_f407zg (ALIENTEK F407ZGT6 dev board) is build-only in CI — no hardware to run.
  build:
    needs: format
    runs-on: ubuntu-24.04
    name: build (${{ matrix.board }})
    strategy:
      fail-fast: false
      matrix:
        board: [mps2/an386, native_sim, qmxx_f407zg]
    steps:
      - uses: actions/checkout@v7
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Build
        run: west build -b ${{ matrix.board }} bms-app/app

  # Gate 3: unit tests + coverage (native_sim; reliable on Linux).
  test-coverage:
    needs: format
    runs-on: ubuntu-24.04
    # twister's coverage tool-selection reads ZEPHYR_TOOLCHAIN_VARIANT directly;
    # action-zephyr-setup doesn't export it, so set it here (SDK gcov path).
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - uses: actions/checkout@v7
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Install gcovr (pinned for reproducible coverage)
        run: pip install "gcovr==7.2"
      - name: Twister + coverage
        run: >
          west twister -T bms-app/tests -p native_sim --inline-logs
          --coverage --coverage-tool gcovr -O twister-out
      - name: App-scoped coverage gate
        # twister's own gcovr is rooted at zephyr/, which excludes our app/ (a
        # sibling dir). Run our own gcovr rooted at the workspace, filtered to
        # app/src + app/include, for a MEANINGFUL number, and gate on it.
        # Baseline (2026-06-18): lines 61.0%, branches 39.1%. Thresholds sit just
        # below the live baseline with margin (catch regressions, avoid flakiness);
        # raise them as coverage grows. Ladder: 55/30 (initial) -> 60/38 (2026-06-30,
        # after protection boundary/NULL cases). Safety-critical pure functions
        # (bms_protection_evaluate / bms_soc_* / bms_afe_validate) target 100% branch.
        run: >
          gcovr --root "$GITHUB_WORKSPACE"
          --filter 'bms-app/app/(src|include)/.*'
          --gcov-ignore-parse-errors=all
          --print-summary
          --fail-under-line 60
          --fail-under-branch 38
          twister-out
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            twister-out/coverage/**
            twister-out/coverage.json
            twister-out/twister.xml

  # Gate 4: static analysis (gcc -fanalyzer), scoped to app code.
  sca-gcc:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Build with gcc analyzer
        run: west build -b mps2/an386 bms-app/app -- -DZEPHYR_SCA_VARIANT=gcc 2>&1 | tee sca-build.log
      - name: Gate on app-code analyzer warnings
        run: bash bms-app/scripts/sca-check.sh sca-build.log
      - name: Upload SCA log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sca-gcc-log
          path: sca-build.log

  # Gate 5: clang-tidy (CERT/readability). HARD gate (WarningsAsErrors in .clang-tidy).
  clang-tidy:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Generate compile_commands.json (native_sim host flags)
        run: west build -b native_sim bms-app/app -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Strip gcc-only flags clang rejects
        run: |
          sed -i -E \
            -e 's/-fno-(reorder-functions|freestanding|defer-pop|printf-return-value)//g' \
            -e 's/-fno-reorder-blocks-and-partition//g' \
            -e 's/--param=[^ "]*//g' \
            build/compile_commands.json
      - name: Run clang-tidy on app sources
        run: clang-tidy -p build $(find bms-app/app/src -name '*.c')

  # Gate 9: cppcheck + MISRA C:2012 (project mode). HARD gate (CPPCHECK_FAIL=1),
  # promoted from observation (workflow.md §8 ladder ② -> ③). Local
  # baseline (cppcheck 2.21) is 0 findings after the suppressions/deviations in
  # .cppcheck-suppressions. NOTE: CI installs cppcheck from apt, whose version may
  # differ from local and emit version-specific MISRA findings; if so, tune
  # .cppcheck-suppressions in the PR before merge. After this merges, add
  # `cppcheck-misra` to the master branch-protection required checks.
  cppcheck-misra:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Fetch MISRA addon (GPLv3, version-matched; not committed)
        run: bash bms-app/scripts/setup-cppcheck-misra.sh
      - name: Generate compile_commands.json (mps2/an386)
        run: west build -b mps2/an386 bms-app/app -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run cppcheck + MISRA (project mode, blocking)
        env:
          CPPCHECK_FAIL: '1'
        run: bash bms-app/scripts/cppcheck-run.sh --project build/compile_commands.json 2>&1 | tee cppcheck-report.txt
      - name: Upload cppcheck/MISRA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-misra-report
          path: cppcheck-report.txt

  # Gate 6: .editorconfig conformance (hygiene only: trailing whitespace / final
  # newline / LF line endings / charset; indentation checks are disabled in .ecrc).
  # Blocking gate (§8 ladder step ③). After this merges, add `editorconfig` to the
  # master branch-protection required checks.
  editorconfig:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install editorconfig-checker (pinned)
        run: |
          EC_VERSION=3.0.3
          curl -fsSL -o ec.tar.gz \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/ec-linux-amd64.tar.gz"
          tar xzf ec.tar.gz
          sudo install bin/ec-linux-amd64 /usr/local/bin/ec
          ec --version
      - name: Run editorconfig-checker
        run: |
          set -o pipefail
          ec 2>&1 | tee editorconfig-report.txt
      - name: Upload editorconfig report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editorconfig-report
          path: editorconfig-report.txt

  # Gate 7: yamllint --strict on repo YAML (west.yml, workflows, dependabot, etc.).
  # Config in .yamllint. Blocking gate (§8 ladder step ③). After this merges, add
  # `yamllint` to the master branch-protection required checks.
  yamllint:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install yamllint (pinned)
        run: pip install "yamllint==1.35.1"
      - name: Run yamllint --strict
        run: |
          set -o pipefail
          yamllint --strict . 2>&1 | tee yamllint-report.txt
      - name: Upload yamllint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yamllint-report
          path: yamllint-report.txt

  # Gate 8: test-presence. Every BMS module under app/src/bms/ must have a
  # tests/bms/<module>/ suite, or be registered in scripts/check-test-files.py
  # EXEMPT (tech-debt ledger). Pure-stdlib Python. Blocking gate; after this
  # merges, add `test-files` to the master branch-protection required checks.
  test-files:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check every module has a test suite
        run: python scripts/check-test-files.py

  # Gate 9: file-header hygiene (coding-style C:002 SPDX + C:004 file-level
  # doxygen), scoped to app/. Pure-stdlib Python, no pinned tool needed.
  # See docs/standard/coding-style.md. Blocking gate (§8 ladder step ③). After this
  # merges, add `file-headers` to the master branch-protection required checks.
  file-headers:
    needs: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check file headers (SPDX + @file/@brief/@ingroup)
        run: |
          set -o pipefail
          python scripts/check-file-headers.py 2>&1 | tee file-headers-report.txt
      - name: Upload file-headers report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: file-headers-report
          path: file-headers-report.txt
