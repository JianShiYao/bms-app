name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Gate 1: formatting (fast fail-first). clang-format pinned to match local.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install clang-format (pinned to local version)
        run: pip install "clang-format==22.1.5"
      - name: Check formatting
        run: |
          files=$(find app drivers tests \( -name '*.c' -o -name '*.h' \) 2>/dev/null)
          if [ -z "$files" ]; then echo "no source files to check"; exit 0; fi
          clang-format --dry-run --Werror --style=file $files

  # Gate 2: build firmware for each compilable target.
  # NOTE: bms_f405 is an incomplete board template — add `enervenue/bms_f405`
  # to the matrix once its dts/defconfig TODOs are resolved.
  build:
    needs: format
    runs-on: ubuntu-latest
    name: build (${{ matrix.board }})
    strategy:
      fail-fast: false
      matrix:
        board: [mps2/an386, native_sim]
    steps:
      - uses: actions/checkout@v6
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Build
        run: west build -b ${{ matrix.board }} bms-app/app

  # Gate 3: unit tests + coverage (native_sim; reliable on Linux).
  test-coverage:
    needs: format
    runs-on: ubuntu-latest
    # twister's coverage tool-selection reads ZEPHYR_TOOLCHAIN_VARIANT directly;
    # action-zephyr-setup doesn't export it, so set it here (SDK gcov path).
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - uses: actions/checkout@v6
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Install gcovr
        run: pip install gcovr
      - name: Twister + coverage
        run: >
          west twister -T bms-app/tests -p native_sim --inline-logs
          --coverage --coverage-tool gcovr -O twister-out
      - name: App-scoped coverage gate
        # twister's own gcovr is rooted at zephyr/, which excludes our app/ (a
        # sibling dir). Run our own gcovr rooted at the workspace, filtered to
        # app/src + app/include, for a MEANINGFUL number, and gate on it.
        # Baseline (2026-06-18): lines 61.0%, branches 39.1%. Thresholds are set
        # below the baseline with margin to catch regressions without flakiness;
        # raise them as test coverage grows.
        run: >
          gcovr --root "$GITHUB_WORKSPACE"
          --filter 'bms-app/app/(src|include)/.*'
          --gcov-ignore-parse-errors=all
          --print-summary
          --fail-under-line 55
          --fail-under-branch 30
          twister-out
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            twister-out/coverage/**
            twister-out/coverage.json
            twister-out/twister.xml

  # Gate 4: static analysis (gcc -fanalyzer), scoped to app code.
  sca-gcc:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Build with gcc analyzer
        run: west build -b mps2/an386 bms-app/app -- -DZEPHYR_SCA_VARIANT=gcc 2>&1 | tee sca-build.log
      - name: Gate on app-code analyzer warnings
        run: bash bms-app/scripts/sca-check.sh sca-build.log
      - name: Upload SCA log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sca-gcc-log
          path: sca-build.log

  # Gate 5: clang-tidy (CERT/readability). HARD gate (WarningsAsErrors in .clang-tidy).
  clang-tidy:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Generate compile_commands.json (native_sim host flags)
        run: west build -b native_sim bms-app/app -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Strip gcc-only flags clang rejects
        run: |
          sed -i -E 's/-fno-(reorder-functions|freestanding|defer-pop|printf-return-value|reorder-blocks-and-partition)//g; s/--param=[^ "]*//g' build/compile_commands.json
      - name: Run clang-tidy on app sources
        run: clang-tidy -p build $(find bms-app/app/src -name '*.c')

  # Observation job (NON-BLOCKING): cppcheck + MISRA addon.
  # development-workflow.md §8 ladder, step ②: runs in CI and reports findings
  # but does NOT block merge (continue-on-error; not a required check). Promote
  # to required (drop continue-on-error + add to branch protection) only after
  # the noise baseline proves stable.
  cppcheck-misra:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: bms-app
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: bms-app
          toolchains: arm-zephyr-eabi
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Fetch MISRA addon (GPLv3, version-matched; not committed)
        run: bash bms-app/scripts/setup-cppcheck-misra.sh
      - name: Generate compile_commands.json (mps2/an386)
        run: west build -b mps2/an386 bms-app/app -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run cppcheck + MISRA (project mode, non-blocking)
        continue-on-error: true
        run: bash bms-app/scripts/cppcheck-run.sh --project build/compile_commands.json 2>&1 | tee cppcheck-report.txt
      - name: Upload cppcheck/MISRA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-misra-report
          path: cppcheck-report.txt
